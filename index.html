<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio010</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <!-- left side -->
      <div class="column-one">
        <img src="img/svg.png" alt="pessoa" class="column-one__img" />
      </div>
      <!-- right side -->
      <div class="wrapper">
        <div class="column-two">
          <!-- form -->
          <form class="form">
            <h2 class="form__subtitle">Bem-vindo de volta</h2>
            <h1 class="form__title">Faça login na sua conta</h1>
            <div class="form-group">
              <label for="email" class="form-group__label">E-mail</label>
              <input type="email" class="form-group__input" />
            </div>
            <div class="form-group">
              <label for="password" class="form-group__label">Senha</label>
              <input type="password" class="form-group__input" />
            </div>
            <div class="group-checkbox">
              <div class="checkbox">
                <input type="checkbox" class="checkbox__input" id="remember" />
                <label for="remember" class="checkbox__label"
                  >Lembre de mim</label
                >
              </div>
              <a href="#" class="checkbox__link">Esqueceu sua senha?</a>
            </div>
            <button class="form-btn" type="submit">Entrar na conta</button>
            <button class="form-btn__google">
              <img src="img/icon.png" alt="google" /> Ou faça login com o Google
            </button>
            <p class="form-paragraph">
              Não tem uma conta?
              <a href="#" class="form-paragraph__link">Cadastre-se</a>
            </p>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
